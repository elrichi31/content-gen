# Postgres local para desarrollo y pruebas: docker compose -f docker-compose.dev.yml up -d
# Solo escucha en 127.0.0.1 y con credenciales de juguete: nunca lo uses fuera de tu máquina.
# El usuario es superusuario a propósito: las pruebas crean y borran una base efímera por test.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: contentgen
      POSTGRES_PASSWORD: contentgen
      POSTGRES_DB: content_gen
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentgen -d content_gen"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
